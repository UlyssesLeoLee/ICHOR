name: ATS-102 build gate

# ATS-102 (SEIKOIST-147) -- 锁文件、依赖与 Windows CI 构建脚本
#
# 门禁内容（对应 docs/02-REQUIREMENTS.md NFR-007 / NFR-012）：
#   1. Node 22 版本断言 + `npm ci`（严格按 lockfile 安装）→ 锁文件可重现性门禁；
#   2. `npm test`（Node 内置 test runner）→ 回归门禁；
#   3. `apps/studio` 的 `npm ci` + 安装树摘要校验 + `next build`
#      → 静态导出构建门禁；
#   4. 依赖清单漂移校验 → 依赖清单门禁。
#
# 本地等价门禁：node tools/ci_build_gate.mjs（步骤与本 workflow 一一对应）。
#
# 测试总数随仓库演进变化，门禁不断言具体数量，只断言 `npm test` 的退出码。
#
# 镜像说明（依据 docs/16-BASELINE-ADR.md §4 B-02）：
#   Windows job 固定在带 Visual Studio 2022 C++ 生成工具的镜像上，
#   以满足 ATS-104 后续的 `cargo build` 需要；Node 版本由 .nvmrc 固定。
#   B-02 的成因清单尚未穷尽，因此本 job 目前只验证 Node 侧产物，
#   Rust/Tauri 侧构建仍属 ATS-104 的验收范围。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 取消同一分支上较早的未完成运行，避免重复占用 runner。
concurrency:
  group: ats102-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 门禁 1+2：Node 22 clean install + npm test（Windows 为目标平台）
  # ---------------------------------------------------------------------
  node-tests:
    name: node22 clean install + test (windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json

      # The Node AND npm versions are asserted here, in one step, because
      # both of them determine what the later steps see:
      #   - the Node major, because the lockfiles were produced by the Node 22
      #     npm and a newer major may resolve differently;
      #   - the npm version, because the recorded installed-tree digest is a
      #     property of the tree ONE npm version installs. npm 10.9.9 and
      #     npm 12.2.0 install different sets of optional packages from the
      #     same lockfile, so under the wrong npm the digest step would fail
      #     with a message about the tree rather than about the npm.
      - name: Verify Node and npm versions match the pinned toolchain
        run: node tools/ci_build_gate.mjs --check-node

      - name: Clean install from lockfile (root)
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile is not mutated by npm ci
        run: |
          git diff --exit-code -- package-lock.json

      - name: Run unit / integration tests
        run: npm test

      - name: Syntax check the bridge entrypoint
        run: node --check server/index.mjs

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: |
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # 门禁 3：Next.js 16 静态导出构建
  # ---------------------------------------------------------------------
  web-build:
    name: next16 static export (windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json

      - name: Clean install from lockfile (apps/studio)
        run: npm ci --no-audit --no-fund
        working-directory: apps/studio

      - name: Verify lockfile is not mutated by npm ci
        run: |
          git diff --exit-code -- apps/studio/package-lock.json

      # The installed tree is pinned to the lockfiles by a path-independent
      # digest, so a swapped tarball or a patched dependency is caught here
      # rather than at runtime. The recorded value is per platform: npm only
      # installs the platform-specific optional packages of the host, so a
      # Linux runner legitimately has a different tree (and would SKIP if no
      # value is recorded for that platform yet).
      - name: Verify the installed tree matches the recorded digest
        run: node tools/tree_digest.mjs --check apps/studio/node_modules

      - name: Build static export
        run: npm run build
        working-directory: apps/studio

      - name: Verify the export artefact exists
        run: node tools/ci_build_gate.mjs --check-artefact

      # next build 会改写两个受版本控制的文件（next-env.d.ts / tsconfig.json）。
      # 这是已知的构建副作用（docs/16-BASELINE-ADR.md §5.2），因此这里只
      # 报告差异而不阻断：差异内容需由人工确认是否应提交。
      - name: Report build side effects on tracked files
        run: |
          git --no-pager diff --stat -- apps/studio/next-env.d.ts apps/studio/tsconfig.json
        continue-on-error: true

      - name: Upload the static export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-static-export
          path: apps/studio/out
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # 门禁 4：依赖清单生成与漂移校验（NFR-012 的可机读部分）
  # ---------------------------------------------------------------------
  dependency-manifest:
    name: dependency manifest drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The manifest is derived from the COMMITTED lockfiles, not from a live
      # node_modules, so this check needs no install step: the generator reads
      # the licences from package-lock.json itself and needs no network.
      #
      # The check compares the COMMITTED manifest against the lockfiles. It
      # must NOT regenerate the manifest first: regenerating writes the file
      # that is then compared with itself, so any drift in the committed
      # manifest would be silently overwritten and never detected. A tampered
      # manifest therefore fails this job with exit code 1.
      - name: Verify the committed manifest matches the lockfiles
        run: node tools/gen_dep_manifest.mjs --check

      - name: Upload the committed manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manifest
          path: docs/dependencies/
          if-no-files-found: error
          retention-days: 7
