[package]
name = "ai-test-studio"
version = "0.1.0"
description = "Local-first visual Playwright test management"
authors = ["AI Test Studio contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_test_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
